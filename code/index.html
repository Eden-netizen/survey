<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Bench Survey</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Anonymous Image Evaluation</p>
        <h1>Image Bench Survey</h1>
      </div>
      <a class="survey-link" id="surveyTopLink" href="#" target="_blank" rel="noreferrer">
        打开匿名问卷
      </a>
    </header>

    <main>
      <section class="intro">
        <div>
          <h2>按 Bench 分区选择最佳模型</h2>
          <p>
            每个分区包含 5 个随机样例。每行左侧为输入图，右侧为目标背景；
            中间四个模型结果分别标为 A、B、C、D，请在每行选择一个结果。
          </p>
        </div>
        <div class="progress-panel">
          <span id="progressText">已选择 0 / 30</span>
          <button id="copyTopButton" type="button">复制所选</button>
        </div>
      </section>

      <nav class="bench-nav" id="benchNav" aria-label="Bench navigation"></nav>
      <div id="benchRoot" class="bench-root"></div>

      <section class="answer-panel" id="answerPanel">
        <div>
          <h2>所选答案</h2>
          <p>复制下面内容后，打开匿名问卷并粘贴提交。</p>
        </div>
        <textarea id="answerText" readonly rows="8" aria-label="Selected answers"></textarea>
      </section>
    </main>

    <footer class="site-footer">
      <span id="footerProgressText">已选择 0 / 30</span>
      <div class="footer-actions">
        <button id="copyBottomButton" type="button">复制所选选项</button>
        <a id="surveyBottomLink" href="#" target="_blank" rel="noreferrer">打开匿名问卷</a>
      </div>
    </footer>

    <script src="./manifest.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
